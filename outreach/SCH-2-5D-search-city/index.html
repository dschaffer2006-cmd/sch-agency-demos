<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCH 2.5D House Motion Lab — 6 Styles</title>
<style>
:root{
  --bg:#090909;--panel:#141414;--panel2:#1b1b1b;--white:#F5F5F0;--steel:#8A8F98;--green:#39FF14;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:var(--white);font-family:Inter,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.viewport{width:min(430px,95vw);aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:22px;background:#0A0A0A;border:1px solid rgba(245,245,240,.09);box-shadow:0 32px 90px rgba(0,0,0,.55)}
.comp{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:
radial-gradient(circle at 50% 38%,rgba(57,255,20,.045),transparent 28%),
linear-gradient(180deg,#0d0d0d,#090909 60%,#060606)}
.top{position:absolute;left:72px;right:72px;top:70px;z-index:20}
.kicker{font:700 18px/1 ui-monospace,Consolas,monospace;letter-spacing:.15em;color:var(--green)}
h1{margin:14px 0 0;font-size:58px;line-height:.98;letter-spacing:-.05em}
h1 span{color:var(--steel)}
.stage{position:absolute;left:0;top:250px;width:1080px;height:1300px;perspective:1400px}
.scene{position:absolute;left:50%;top:52%;width:760px;height:900px;transform:translate(-50%,-50%);transform-style:preserve-3d}
.floor{position:absolute;left:50%;top:58%;width:610px;height:380px;transform:translate(-50%,-50%) rotateX(58deg) rotateZ(45deg);background:#1c1c1c;border:1px solid rgba(245,245,240,.08);box-shadow:0 50px 80px rgba(0,0,0,.55);border-radius:10px}
.floor:before,.floor:after{content:"";position:absolute;background:rgba(245,245,240,.035)}
.floor:before{left:50%;top:0;width:1px;height:100%}.floor:after{top:50%;left:0;height:1px;width:100%}
.houseWrap{position:absolute;left:50%;top:53%;width:460px;height:520px;transform:translate(-50%,-50%);transform-style:preserve-3d}
.house{position:absolute;left:50%;top:52%;width:320px;height:330px;transform:translate(-50%,-50%) rotateX(-6deg) rotateY(0deg) rotateZ(0deg);transform-style:preserve-3d}
.body{position:absolute;left:40px;top:105px;width:240px;height:180px;background:#202020;border:2px solid rgba(245,245,240,.12);box-shadow:inset 0 1px rgba(255,255,255,.05),0 32px 60px rgba(0,0,0,.35)}
.side{position:absolute;left:280px;top:105px;width:95px;height:180px;transform-origin:left center;transform:skewY(-28deg);background:#121212;border:2px solid rgba(245,245,240,.08)}
.roofA{position:absolute;left:27px;top:45px;width:268px;height:95px;background:#2d2d2d;clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:2px solid rgba(245,245,240,.1)}
.roofB{position:absolute;left:294px;top:92px;width:95px;height:73px;background:#151515;transform:skewY(-28deg);transform-origin:left top}
.door{position:absolute;left:135px;top:205px;width:55px;height:80px;background:#0d0d0d;border:2px solid rgba(245,245,240,.1)}
.window{position:absolute;width:48px;height:48px;background:#0f0f0f;border:2px solid rgba(245,245,240,.12)}
.w1{left:68px;top:160px}.w2{left:204px;top:160px}
.window:after{content:"";position:absolute;inset:8px;border:1px solid rgba(57,255,20,.22)}
.badge{position:absolute;left:50%;top:15px;transform:translateX(-50%);padding:14px 20px;border-radius:18px;background:rgba(14,14,14,.9);border:1px solid rgba(245,245,240,.15);font:700 22px ui-monospace,Consolas,monospace;box-shadow:0 18px 45px rgba(0,0,0,.35);opacity:0}
.badge b{color:var(--green)}
.shadow{position:absolute;left:50%;top:76%;width:330px;height:90px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 68%);filter:blur(8px)}
.label{position:absolute;left:72px;right:72px;bottom:170px;padding:24px 26px;border-radius:24px;background:linear-gradient(145deg,rgba(245,245,240,.055),rgba(16,16,16,.88));border:1px solid rgba(245,245,240,.12);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.label .num{font:700 15px ui-monospace,Consolas,monospace;color:var(--green);letter-spacing:.13em}
.label .name{font-size:38px;font-weight:800;letter-spacing:-.04em;margin-top:8px}
.label .desc{font:15px/1.45 ui-monospace,Consolas,monospace;color:var(--steel);margin-top:9px}
.controls{width:min(920px,95vw);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.controls button{border:1px solid rgba(245,245,240,.1);background:#111;color:var(--white);padding:12px 10px;border-radius:12px;font:750 11px ui-monospace,Consolas,monospace;cursor:pointer}
.controls button:hover,.controls button.active{border-color:rgba(57,255,20,.55);color:var(--green);background:#131713}
.playrow{width:min(920px,95vw);display:flex;align-items:center;gap:10px}
#play{border:1px solid rgba(245,245,240,.12);background:#111;color:var(--white);padding:10px 14px;border-radius:11px;font:800 11px ui-monospace,Consolas,monospace;cursor:pointer}
#scrub{flex:1;accent-color:var(--green)}
.time{font:11px ui-monospace,Consolas,monospace;color:var(--steel);min-width:92px;text-align:right}
.note{max-width:920px;text-align:center;color:#656a70;font:10px/1.45 ui-monospace,Consolas,monospace}
.wire{position:absolute;inset:0;pointer-events:none;opacity:0}
.wire .body,.wire .side,.wire .roofA,.wire .roofB,.wire .door,.wire .window{background:transparent!important;border-color:rgba(57,255,20,.55)!important;box-shadow:none!important}
.wire .window:after{display:none}
.part{transform-origin:center center}
.ring{position:absolute;left:50%;top:54%;width:260px;height:260px;border-radius:50%;border:3px solid var(--green);transform:translate(-50%,-50%) scale(.3);opacity:0;box-shadow:0 0 30px rgba(57,255,20,.12)}
.neighbor{position:absolute;width:180px;height:190px;opacity:.15}
.n1{left:55px;top:550px;transform:scale(.75)}
.n2{right:55px;top:455px;transform:scale(.85)}
.neighbor .body{left:0;top:55px;width:145px;height:100px}.neighbor .side{left:145px;top:55px;width:48px;height:100px}.neighbor .roofA{left:-8px;top:8px;width:160px;height:62px}.neighbor .roofB{left:151px;top:45px;width:48px;height:42px}
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <div class="comp" id="comp">
    <div class="top">
      <div class="kicker">SCH 2.5D MOTION LAB</div>
      <h1>6 house animation <span>directions.</span></h1>
    </div>
    <div class="stage">
      <div class="scene" id="scene">
        <div class="floor" id="floor"></div>
        <div class="neighbor n1" id="n1"><div class="roofA"></div><div class="roofB"></div><div class="body"></div><div class="side"></div></div>
        <div class="neighbor n2" id="n2"><div class="roofA"></div><div class="roofB"></div><div class="body"></div><div class="side"></div></div>
        <div class="shadow" id="shadow"></div>
        <div class="houseWrap" id="houseWrap">
          <div class="house" id="house">
            <div class="roofA part" id="roofA"></div>
            <div class="roofB part" id="roofB"></div>
            <div class="body part" id="body"></div>
            <div class="side part" id="side"></div>
            <div class="door part" id="door"></div>
            <div class="window w1 part" id="w1"></div>
            <div class="window w2 part" id="w2"></div>
          </div>
          <div class="house wire" id="wire">
            <div class="roofA"></div><div class="roofB"></div><div class="body"></div><div class="side"></div><div class="door"></div><div class="window w1"></div><div class="window w2"></div>
          </div>
        </div>
        <div class="ring" id="ring"></div>
        <div class="badge" id="badge"><b>4.9 ★</b> · 328 reviews</div>
      </div>
    </div>
    <div class="label">
      <div class="num" id="num">STYLE 01</div>
      <div class="name" id="name">Build Up</div>
      <div class="desc" id="desc">A ház rétegenként épül fel alulról felfelé.</div>
    </div>
  </div>
</div>

<div class="controls">
  <button data-style="0">01 BUILD UP</button>
  <button data-style="1">02 EXPLODED</button>
  <button data-style="2">03 WIREFRAME → SOLID</button>
  <button data-style="3">04 SEARCH PULSE</button>
  <button data-style="4">05 CAMERA ORBIT</button>
  <button data-style="5">06 NEIGHBORHOOD FOCUS</button>
</div>
<div class="playrow"><button id="play">PAUSE</button><input id="scrub" type="range" min="0" max="5" step=".01" value="0"><div class="time" id="time">0.00 / 5.00</div></div>
<div class="note">Ugyanaz az egyszerű ház, 6 külön mozgáslogika. Kattints egy stílusra és lejátszható külön.</div>

<script>
const D=5;
const styles=[
 {name:'Build Up',desc:'A ház rétegenként épül fel alulról felfelé.'},
 {name:'Exploded Assembly',desc:'A tető, falak, ajtó és ablakok külön érkeznek, majd összeállnak.'},
 {name:'Wireframe → Solid',desc:'Először technikai neon kontúr, majd abból materializálódik a kész épület.'},
 {name:'Search Pulse',desc:'Keresési hullám aktiválja a házat, majd feljön fölé az értékelés.'},
 {name:'Camera Orbit',desc:'A ház körül finoman elfordul a kamera és mélységet mutat, nem csak sima flat mozgás.'},
 {name:'Neighborhood Focus',desc:'Környezetből választja ki a rendszer a releváns épületet; a többi visszahúzódik.'}
];
const $=id=>document.getElementById(id);
const viewport=$('viewport'),comp=$('comp'),scene=$('scene'),house=$('house'),houseWrap=$('houseWrap'),floor=$('floor'),shadow=$('shadow'),badge=$('badge'),wire=$('wire'),ring=$('ring'),n1=$('n1'),n2=$('n2');
const parts=['roofA','roofB','body','side','door','w1','w2'].map($);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,p)=>a+(b-a)*p;

let style=0,current=0,playing=true,startStamp=0,startT=0,raf=0;

function scale(){comp.style.transform='scale('+(viewport.clientWidth/1080)+')'} scale(); addEventListener('resize',scale);

function reset(){
 scene.style.transform='';
 houseWrap.style.transform='translate(-50%,-50%)';
 house.style.transform='translate(-50%,-50%)';
 house.style.opacity=1;
 floor.style.opacity=1;
 floor.style.transform='translate(-50%,-50%) rotateX(58deg) rotateZ(45deg)';
 shadow.style.opacity=1;shadow.style.transform='translateX(-50%) scale(1)';
 badge.style.opacity=0;badge.style.transform='translateX(-50%) translateY(18px) scale(.92)';
 wire.style.opacity=0;wire.style.transform='translate(-50%,-50%)';
 ring.style.opacity=0;ring.style.transform='translate(-50%,-50%) scale(.3)';
 n1.style.opacity=.12;n2.style.opacity=.12;
 n1.style.transform='scale(.75)';n2.style.transform='scale(.85)';
 parts.forEach(p=>{p.style.opacity=1;p.style.transform='';p.style.filter=''});
}
function render(t){
 reset();
 const p=t/D;
 if(style===0){
   const seq=[2,3,4,5,6,0,1];
   seq.forEach((idx,k)=>{
     const q=ease((t-(.25+k*.32))/.55), el=parts[idx];
     el.style.opacity=q;
     el.style.transform='translateY('+lerp(85,0,q)+'px) scaleY('+lerp(.35,1,q)+')';
   });
   houseWrap.style.transform='translate(-50%,-50%) translateY('+lerp(35,0,ease(t/1.1))+'px)';
 }
 if(style===1){
   const vec=[
    [0,-145],[105,-100],[-150,55],[160,55],[0,140],[-110,0],[110,0]
   ];
   parts.forEach((el,i)=>{
     const q=ease((t-(.25+i*.16))/.8),v=vec[i];
     el.style.opacity=q;
     el.style.transform='translate('+lerp(v[0],0,q)+'px,'+lerp(v[1],0,q)+'px) rotate('+lerp((i%2?1:-1)*10,0,q)+'deg)';
   });
   houseWrap.style.transform='translate(-50%,-50%) scale('+lerp(.92,1,ease((t-.2)/1.4))+')';
 }
 if(style===2){
   const q=ease(t/1.2),s=ease((t-1.25)/1.1);
   house.style.opacity=s;
   house.style.filter='brightness('+lerp(.55,1,s)+')';
   wire.style.opacity=(1-s)*q;
   wire.style.transform='translate(-50%,-50%) scale('+lerp(.92,1,q)+')';
   ring.style.opacity=(1-s)*.45;
   ring.style.transform='translate(-50%,-50%) scale('+lerp(.5,3.1,ease((t-.2)/1.4))+')';
 }
 if(style===3){
   const rq=clamp((t-.45)/1.15);
   ring.style.opacity=(1-rq)*.95;
   ring.style.transform='translate(-50%,-50%) scale('+lerp(.25,6,ease(rq))+')';
   const h=ease((t-1.4)/.55);
   houseWrap.style.transform='translate(-50%,-50%) translateY('+lerp(0,-24,h)+'px) scale('+lerp(1,1.06,h)+')';
   house.style.filter='brightness('+lerp(1,1.25,h)+')';
   const b=ease((t-2.0)/.5);
   badge.style.opacity=b;
   badge.style.transform='translateX(-50%) translateY('+lerp(18,0,b)+'px) scale('+lerp(.92,1,b)+')';
 }
 if(style===4){
   const q=smooth((t-.3)/4.2);
   scene.style.transform='rotateY('+lerp(-10,12,q)+'deg) rotateX('+lerp(2,-2,q)+'deg)';
   houseWrap.style.transform='translate(-50%,-50%) translateY('+(-8*Math.sin(p*Math.PI))+'px) scale('+lerp(.96,1.04,Math.sin(p*Math.PI))+')';
   floor.style.transform='translate(-50%,-50%) rotateX('+lerp(55,62,q)+'deg) rotateZ('+lerp(39,50,q)+'deg)';
 }
 if(style===5){
   const q=ease((t-.8)/.7),focus=ease((t-1.5)/.7);
   n1.style.opacity=lerp(.32,.06,focus);n2.style.opacity=lerp(.32,.06,focus);
   n1.style.transform='scale('+lerp(.8,.68,focus)+') translateX('+lerp(0,-40,focus)+'px)';
   n2.style.transform='scale('+lerp(.9,.76,focus)+') translateX('+lerp(0,35,focus)+'px)';
   houseWrap.style.transform='translate(-50%,-50%) translateY('+lerp(18,-28,q)+'px) scale('+lerp(.9,1.1,focus)+')';
   house.style.filter='brightness('+lerp(.8,1.25,focus)+')';
   const b=ease((t-2.25)/.45); badge.style.opacity=b;badge.style.transform='translateX(-50%) translateY('+lerp(18,0,b)+'px) scale(1)';
 }
 $('scrub').value=t; $('time').textContent=t.toFixed(2)+' / 5.00';
}
function select(i){
 style=i;current=0;startStamp=0;startT=0;
 document.querySelectorAll('[data-style]').forEach((b,k)=>b.classList.toggle('active',k===i));
 $('num').textContent='STYLE '+String(i+1).padStart(2,'0');
 $('name').textContent=styles[i].name;$('desc').textContent=styles[i].desc;
 playing=true;$('play').textContent='PAUSE';render(0);
}
function tick(ts){
 if(!playing)return;
 if(!startStamp)startStamp=ts;
 current=startT+(ts-startStamp)/1000;
 if(current>=D){current=0;startStamp=ts;startT=0}
 render(current);raf=requestAnimationFrame(tick);
}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>select(+b.dataset.style));
$('play').onclick=()=>{
 if(playing){playing=false;cancelAnimationFrame(raf);$('play').textContent='PLAY'}
 else{playing=true;startStamp=0;startT=current;$('play').textContent='PAUSE';raf=requestAnimationFrame(tick)}
};
$('scrub').oninput=e=>{playing=false;cancelAnimationFrame(raf);$('play').textContent='PLAY';current=+e.target.value;render(current)};
window.renderAt=render;window.__duration=D;window.setStyle=select;
select(0);raf=requestAnimationFrame(tick);
</script>
</body>
</html>
