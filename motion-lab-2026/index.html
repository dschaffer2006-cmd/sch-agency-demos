function card(d){return '<article class="card" data-cat="'+d[2]+'"><div class="stage run" id="s'+d[0]+'">'+art(d[0])+'</div><div class="meta"><div class="row"><div><div class="num">'+d[0]+'</div><div class="name">'+d[1]+'</div></div><div class="cat">'+d[2]+'</div></div><div class="desc">'+d[3]+'</div><div class="foot"><a class="src" href="'+d[5]+'" target="_blank" rel="noreferrer">'+d[4]+'</a><button class="replay" data-id="'+d[0]+'">REPLAY</button></div></div></article>'}
document.getElementById("grid").innerHTML=demos.map(card).join("");
function replay(stage){stage.classList.remove("run");void stage.offsetWidth;stage.classList.add("run")}
document.addEventListener("click",function(e){var b=e.target.closest(".replay");if(b)replay(document.getElementById("s"+b.dataset.id));var f=e.target.closest(".filter");if(f){document.querySelectorAll(".filter").forEach(function(x){x.classList.remove("active")});f.classList.add("active");var v=f.dataset.filter;document.querySelectorAll(".card").forEach(function(c){c.classList.toggle("hidden",v!=="ALL"&&c.dataset.cat!==v)})}});
document.getElementById("all").addEventListener("click",function(){document.querySelectorAll(".stage").forEach(replay)});
setInterval(function(){document.querySelectorAll(".stage").forEach(replay)},5200);
