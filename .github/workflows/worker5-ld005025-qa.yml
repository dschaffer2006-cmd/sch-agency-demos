name: Worker 5 LD-005-025 QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply targeted mobile fix
        run: python3 tools/worker5_ld005025_mobile_fix.py
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/w5-ld005025.log 2>&1 &
          sleep 2
      - name: Run QA
        run: node tools/worker5_ld005025_qa.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker5-ld005025-qa
          path: |
            worker5-ld005025-qa-report.json
            outreach/LD-005-025-re-szepseg-egeszseg/*.png
          retention-days: 14
      - name: Commit targeted fixed HTML after PASS
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outreach/LD-005-025-re-szepseg-egeszseg/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix LD-005-025 mobile overflow'
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
