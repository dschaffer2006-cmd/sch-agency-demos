name: Worker 1 verify LD-001 public Pages

on:
  push:
    paths:
      - '.github/workflows/worker1-verify-ld001-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify four public demo URLs
        run: |
          set -euo pipefail
          # Retry until GitHub Pages has published the latest main-branch content.
          urls=(
            'https://dschaffer2006-cmd.github.io/sch-agency-demos/outreach/LD-001-011-baranyai-szalon/'
            'https://dschaffer2006-cmd.github.io/sch-agency-demos/outreach/LD-001-017-skin-line-kozmetika/'
            'https://dschaffer2006-cmd.github.io/sch-agency-demos/outreach/LD-001-016-nagy-szilvia-fodrasz/'
            'https://dschaffer2006-cmd.github.io/sch-agency-demos/outreach/LD-001-006-haj-lak-fodraszat/'
          )
          : > worker1-ld001-pages-status.txt
          for url in "${urls[@]}"; do
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$url" || true)
              if [ "$code" = '200' ] && grep -q 'Koncepciódemó' /tmp/page.html; then
                title=$(python3 - <<'PY'
import re
s=open('/tmp/page.html',encoding='utf-8').read()
m=re.search(r'<title>(.*?)</title>',s,re.I|re.S)
print((m.group(1).strip() if m else 'NO_TITLE'))
PY
)
                echo "200 $url | $title" | tee -a worker1-ld001-pages-status.txt
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" = '1'
          done
      - name: Commit public verification report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add worker1-ld001-pages-status.txt
          if git diff --cached --quiet; then
            echo 'Verification report unchanged.'
          else
            git commit -m 'Verify Worker 1 LD-001 public demo URLs [skip ci]'
            git push origin HEAD:main
          fi
