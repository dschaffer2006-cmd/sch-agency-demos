name: Worker 4 171-190 payload diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker4-171-190-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect payload markers
        run: |
          python3 <<'PY'
          import base64,io,tarfile,pathlib,json,re
          raw=base64.b64decode(pathlib.Path('.github/worker4_171_190_payload.txt').read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf: tf.extractall('.')
          m=json.loads(pathlib.Path('worker4-batch-manifest.json').read_text())
          markers=['svgdraw','circlebadge','meshfx','dragCanvas','id="odo"','id="island"','id="burst"','trail-dot','magGrid','id="morph"','class="dock"','scrambleChip','id="range"','id="shade"','service-card','marquee-track','text-mask','curtain','gradient-stroke','flip','spotlight','parallax','accordion','coverflow','beforeafter']
          lines=[]
          for x in m:
            s=(pathlib.Path(x['slug'])/'index.html').read_text(encoding='utf-8')
            found=[k for k in markers if k in s]
            lines.append(f"{x['id']}\t{x['template']}\t{x['slug']}\t"+','.join(found))
          pathlib.Path('worker4-171-190-marker-report.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker4-171-190-marker-report.tsv
          git commit -m 'Worker 4 payload marker diagnostic 171-190' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
