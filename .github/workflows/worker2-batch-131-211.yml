name: Worker 2 batch 131-150 and 211

on:
  push:
    branches: [main]
    paths:
      - 'scripts/worker2-batch-131-211.js'
      - 'worker2-batch-131-211-trigger.txt'
      - '.github/workflows/worker2-batch-131-211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-qa-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 20 Worker 2 demos
        run: node scripts/worker2-batch-131-211.js
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/worker2-batch-server.log 2>&1 &
          sleep 2
      - name: Browser QA and mobile previews
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const {chromium}=require('playwright');
          const manifest=JSON.parse(fs.readFileSync('worker2-batch-131-211.json','utf8'));
          const report=[];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const lead of manifest){
              const r={n:lead.n,name:lead.name,slug:lead.slug,template:lead.template,effects:lead.effects,critical:[],viewports:{}};
              for(const vp of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]){
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},reducedMotion:'no-preference'});
                const consoleErrors=[],pageErrors=[],failed=[];
                page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('requestfailed',req=>failed.push(req.url()+' :: '+(req.failure()?.errorText||'')));
                let resp=null; try{resp=await page.goto(`http://127.0.0.1:8765/${lead.slug}/`,{waitUntil:'networkidle',timeout:30000})}catch(e){r.critical.push(`${vp.name}: navigation ${e.message}`)}
                await page.waitForTimeout(300);
                const m=await page.evaluate(()=>{const h=document.querySelector('h1'),header=document.querySelector('header'),sects=[...document.querySelectorAll('main section')].map(el=>{const x=el.getBoundingClientRect();return {w:x.width,h:x.height}});const txt=document.body.innerText.toLowerCase();const hr=h?.getBoundingClientRect();return {viewport:!!document.querySelector('meta[name="viewport"]'),sw:document.documentElement.scrollWidth,iw:innerWidth,headline:hr?{left:hr.left,right:hr.right,top:hr.top,bottom:hr.bottom}:null,headerH:header?.getBoundingClientRect().height||0,sections:sects,forbidden:['lorem ipsum','todo','image here','photo here','placeholder'].filter(x=>txt.includes(x)),links:[...document.querySelectorAll('a')].filter(a=>!a.getAttribute('href')||a.getAttribute('href')==='#').length}});
                if(!resp||resp.status()<200||resp.status()>=300)r.critical.push(`${vp.name}: HTTP ${resp?.status()||'none'}`);
                if(consoleErrors.length)r.critical.push(`${vp.name}: console ${consoleErrors.join(' | ')}`);
                if(pageErrors.length)r.critical.push(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
                if(failed.length)r.critical.push(`${vp.name}: failed requests ${failed.join(' | ')}`);
                if(!m.viewport)r.critical.push(`${vp.name}: viewport meta missing`);
                if(m.sw>m.iw+1)r.critical.push(`${vp.name}: horizontal overflow ${m.sw}>${m.iw}`);
                if(!m.headline||m.headline.left<0||m.headline.right>m.iw+1)r.critical.push(`${vp.name}: headline overflow`);
                if(m.sections.some(s=>s.w===0||s.h===0))r.critical.push(`${vp.name}: zero-size section`);
                if(m.forbidden.length)r.critical.push(`${vp.name}: forbidden ${m.forbidden.join(',')}`);
                if(m.links)r.critical.push(`${vp.name}: empty links ${m.links}`);
                await page.evaluate(()=>scrollTo(0,Math.min(700,document.body.scrollHeight-innerHeight)));
                await page.waitForTimeout(150);
                const scrollState=await page.evaluate(()=>document.body.dataset.fxScroll||'');
                if(!scrollState)r.critical.push(`${vp.name}: scroll interaction did not change state`);
                const card=page.locator('.fx-card').first(); if(await card.count()){await card.click();const cardState=await page.evaluate(()=>document.body.dataset.fxCard||'');if(!cardState)r.critical.push(`${vp.name}: card interaction did not change state`)}
                if(vp.name==='mobile'){
                  const menu=page.locator('#menu'); await menu.click(); const open=await page.locator('#nav').evaluate(el=>el.classList.contains('open')); if(!open)r.critical.push('mobile: menu did not open'); const first=page.locator('#nav a').first(); await first.click(); const still=await page.locator('#nav').evaluate(el=>el.classList.contains('open')); if(still)r.critical.push('mobile: menu did not close');
                  await page.goto(`http://127.0.0.1:8765/${lead.slug}/`,{waitUntil:'networkidle'}); await page.screenshot({path:path.join(lead.slug,'preview-mobile.png'),fullPage:false});
                }
                r.viewports[vp.name]={status:resp?.status()||null,metrics:m}; await page.close();
              }
              const rm=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});await rm.goto(`http://127.0.0.1:8765/${lead.slug}/`,{waitUntil:'networkidle'});const readable=await rm.evaluate(()=>{const els=[...document.querySelectorAll('main h1,main h2,main p,.card')];return els.every(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.visibility!=='hidden'&&Number(s.opacity)>0&&r.height>0})});if(!readable)r.critical.push('reduced-motion: content not readable');await rm.close();
              r.result=r.critical.length?'FAIL':'PASS';report.push(r);console.log(`WORKER2 ${lead.n} ${lead.slug} ${r.result}${r.critical.length?' :: '+r.critical.join(' || '):''}`);
            }
            await browser.close();
            fs.writeFileSync('worker2-batch-131-211-qa.json',JSON.stringify(report,null,2));
            const fail=report.filter(x=>x.result==='FAIL');console.log(`SUMMARY total=${report.length} pass=${report.length-fail.length} fail=${fail.length}`);if(fail.length)process.exit(1);
          })();
          NODE
      - name: Commit generated demos and QA report
        run: |
          git config user.name 'sch-factory-worker2'
          git config user.email 'actions@users.noreply.github.com'
          git add worker2-batch-131-211.json worker2-batch-131-211-qa.json
          node -e "const m=require('./worker2-batch-131-211.json');for(const x of m){require('child_process').execFileSync('git',['add',x.slug])}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Worker 2: publish leads 131-150 and 211 after Chromium QA'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
