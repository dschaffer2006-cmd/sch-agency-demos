name: FB Worker2 facebook-scraper public test

on:
  push:
    branches: [fb-research-worker2]
    paths:
      - 'research/fb-worker2/facebook-scraper-trigger.txt'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb-research-worker2
      - name: Install scraper
        run: pip install -q facebook-scraper
      - name: Scrape public group without credentials
        run: |
          mkdir -p research/fb-worker2/facebook-scraper-test
          python3 - <<'PY'
          import json,traceback,pathlib
          from facebook_scraper import get_posts
          result=[]; err=''
          try:
              for i,p in enumerate(get_posts(group='883708115725466', pages=20, options={'comments': True, 'allow_extra_requests': True, 'posts_per_page': 10})):
                  result.append({
                      'post_id':p.get('post_id'),'post_url':p.get('post_url'),'time':str(p.get('time')),
                      'text':p.get('text'),'comments_count':p.get('comments'),'comments_full':p.get('comments_full',[])[:30]
                  })
                  if len(result)>=120: break
          except Exception as e:
              err=traceback.format_exc()
          pathlib.Path('research/fb-worker2/facebook-scraper-test/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          pathlib.Path('research/fb-worker2/facebook-scraper-test/summary.json').write_text(json.dumps({'posts':len(result),'posts_with_comments_full':sum(bool(x['comments_full']) for x in result),'error':err[-6000:]},ensure_ascii=False,indent=2),encoding='utf-8')
          print('posts',len(result),'with comments',sum(bool(x['comments_full']) for x in result)); print(err[-1000:])
          PY
      - name: Commit output
        if: always()
        run: |
          git config user.name 'Worker 2 Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/fb-worker2/facebook-scraper-test
          git diff --cached --quiet && exit 0
          git commit -m 'FB Worker2 credential-free scraper test output'
          git push origin HEAD:fb-research-worker2
