name: Worker 2 outreach demo QA

on:
  push:
    paths:
      - 'outreach/LD-001-020-hazuga-alexandra-fodrasz/**'
      - 'outreach/LD-003-018-pedikur-manikur-szepsegszalon/**'
      - 'outreach/LD-004-016-szalai-bettina-kozmetika-sminktetovalas/**'
      - 'outreach/assets/demo.css'
      - 'outreach/assets/demo.js'
      - 'tools/worker2-outreach-demo-qa.mjs'
      - '.github/workflows/worker2-outreach-demo-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve repo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/worker2-demo-http.log 2>&1 &
          echo $! > /tmp/worker2-demo-http.pid
          sleep 2
      - name: Chromium QA
        run: node tools/worker2-outreach-demo-qa.mjs
      - name: Commit QA artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker2-outreach-demo-qa.json qa/worker2 outreach/LD-001-020-hazuga-alexandra-fodrasz/preview-mobile.png outreach/LD-003-018-pedikur-manikur-szepsegszalon/preview-mobile.png outreach/LD-004-016-szalai-bettina-kozmetika-sminktetovalas/preview-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m 'Worker 2 demo QA artifacts [skip ci]'
            git push
          fi
