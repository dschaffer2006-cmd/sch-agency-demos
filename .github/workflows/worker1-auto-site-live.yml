name: Worker 1 Autonomous Site Live Verify

on:
  push:
    paths:
      - '.github/workflows/worker1-auto-site-live.yml'
      - 'worker1-auto-site-qa-manifest.json'
      - 'outreach/LD-001-0*/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public routes from manifest
        run: |
          set -euo pipefail
          : > worker1-auto-site-pages-status.txt
          python3 - <<'PY' > /tmp/w1-sites.txt
          import json
          for x in json.load(open('worker1-auto-site-qa-manifest.json',encoding='utf-8'))['sites']:
              print(x['slug']+'\t'+x['name'])
          PY
          while IFS=$'\t' read -r slug name; do
            url="https://dschaffer2006-cmd.github.io/sch-agency-demos/outreach/$slug/"
            ok=0
            for i in $(seq 1 36); do
              code=$(curl -L -sS --max-time 30 -o /tmp/page.html -w '%{http_code}' "$url" || true)
              if [ "$code" = '200' ] && grep -Eqi 'Koncepciódemó|bemutató célból' /tmp/page.html; then
                title=$(grep -Eio '<title>[^<]*</title>' /tmp/page.html | head -1 | sed -E 's#</?title>##gI')
                echo "LIVE_QA 200 $url | $title" | tee -a worker1-auto-site-pages-status.txt
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" = '1'
          done < /tmp/w1-sites.txt
      - name: Commit verification report safely
        run: |
          set -euo pipefail
          cp worker1-auto-site-pages-status.txt /tmp/worker1-auto-site-pages-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -B worker1-auto-live-publish origin/main
          cp /tmp/worker1-auto-site-pages-status.txt worker1-auto-site-pages-status.txt
          git add worker1-auto-site-pages-status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify Worker 1 autonomous public demo URLs [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
