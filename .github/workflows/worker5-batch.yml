name: Worker 5 build and browser QA

on:
  push:
    branches: [main]
    paths:
      - 'tools/worker5_generate.py'
      - '.github/workflows/worker5-batch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/worker5_generate.py'
      - '.github/workflows/worker5-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-qa-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Generate Worker 5 sites
        run: python3 tools/worker5_generate.py
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/worker5-server.log 2>&1 &
          sleep 2
      - name: Browser QA
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path'), {chromium}=require('playwright');
          const slugs=['viki-hair-zalaegerszeg','dorka-fodrasza-egerszeg','orchidea-szepsegszalon-zalaegerszeg','ls-hair-studio-zalaegerszeg','hairstyles-by-mimi','gabi-mesterfodrasz-hajorvos-nagykanizsa','kreativ-hajstudio-nagykanizsa','prestige-szepsegszalon-nagykanizsa','bella-fodraszcikk-nagykanizsa','torok-laura-hairdresser-nagykanizsa','barber-boys-hair-salon-nagykanizsa','pimpike-szepsegkucko-nagykanizsa','eva-fodraszata-tapolca','stilus-kozmetika-tapolca','varga-andras-fodrasz-tapolca','luxury-szalon-tapolca','pipere-box-tapolca','shiny-hair-nail-tapolca'];
          (async()=>{
            const browser=await chromium.launch({headless:true}); const report=[];
            for(const slug of slugs){
              const row={slug,critical:[],desktop:{},mobile:{}};
              for(const vp of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]){
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}}), ce=[], pe=[], rf=[];
                page.on('console',m=>{if(m.type()==='error')ce.push(m.text())}); page.on('pageerror',e=>pe.push(String(e))); page.on('requestfailed',r=>rf.push(r.url()));
                let res=null; try{res=await page.goto(`http://127.0.0.1:8765/${slug}/`,{waitUntil:'networkidle',timeout:30000})}catch(e){row.critical.push(`${vp.name}: navigation ${e.message}`)}
                const m=await page.evaluate(()=>{const h=document.querySelector('h1')?.getBoundingClientRect(), header=document.querySelector('header')?.getBoundingClientRect(), text=document.body.innerText.toLowerCase(); return {viewport:!!document.querySelector('meta[name="viewport"]'),sw:document.documentElement.scrollWidth,iw:innerWidth,h:h?{l:h.left,r:h.right}:null,headerH:header?.height||0,sections:[...document.querySelectorAll('main section')].map(x=>{let r=x.getBoundingClientRect();return [r.width,r.height]}),forbidden:['lorem ipsum','todo','placeholder'].filter(x=>text.includes(x)),tel:document.querySelectorAll('a[href^="tel:"]').length}});
                if(!res||res.status()<200||res.status()>299)row.critical.push(`${vp.name}: HTTP ${res?.status()||'none'}`); if(ce.length)row.critical.push(`${vp.name}: console ${ce.join(' | ')}`); if(pe.length)row.critical.push(`${vp.name}: pageerror ${pe.join(' | ')}`); if(rf.length)row.critical.push(`${vp.name}: failed requests ${rf.join(' | ')}`); if(!m.viewport)row.critical.push(`${vp.name}: viewport missing`); if(m.sw>m.iw+1)row.critical.push(`${vp.name}: overflow ${m.sw}>${m.iw}`); if(!m.h||m.h.l<0||m.h.r>m.iw+1)row.critical.push(`${vp.name}: h1 outside viewport`); if(m.sections.some(s=>s[0]<=0||s[1]<=0))row.critical.push(`${vp.name}: zero-size section`); if(m.forbidden.length)row.critical.push(`${vp.name}: forbidden ${m.forbidden.join(',')}`); if(m.tel<1)row.critical.push(`${vp.name}: no phone CTA`);
                for(const id of ['szolg','kapcsolat']){await page.locator(`#${id}`).scrollIntoViewIfNeeded(); await page.waitForTimeout(80); const y=await page.locator(`#${id}`).evaluate(el=>el.getBoundingClientRect().top); if(y<m.headerH-4)row.critical.push(`${vp.name}: header overlap #${id}`)}
                if(vp.name==='mobile'){const menu=page.locator('#menu'),nav=page.locator('#nav'); await page.evaluate(()=>scrollTo(0,0)); await menu.click(); if(!(await nav.evaluate(el=>el.classList.contains('open')&&getComputedStyle(el).display!=='none')))row.critical.push('mobile: menu open failed'); await nav.locator('a').first().click(); if(await nav.evaluate(el=>el.classList.contains('open')))row.critical.push('mobile: menu close failed')}
                await page.goto(`http://127.0.0.1:8765/${slug}/`,{waitUntil:'domcontentloaded'}); await page.screenshot({path:path.join(slug,`preview-${vp.name}.png`),fullPage:false}); await page.screenshot({path:path.join(slug,`${vp.name}-full.png`),fullPage:true}); row[vp.name]={status:res?.status()||null,metrics:m}; await page.close();
              }
              row.result=row.critical.length?'FAIL':'PASS'; report.push(row); console.log(`WORKER5_QA ${slug} ${row.result}${row.critical.length?' :: '+row.critical.join(' || '):''}`);
            }
            await browser.close(); fs.writeFileSync('worker5-qa-report.json',JSON.stringify(report,null,2)); const bad=report.filter(x=>x.result==='FAIL'); console.log(`WORKER5_QA_SUMMARY total=${report.length} pass=${report.length-bad.length} fail=${bad.length}`); if(bad.length)process.exitCode=1;
          })();
          NODE
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker5-qa-report
          path: worker5-qa-report.json
          retention-days: 14
      - name: Commit passing Worker 5 batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viki-hair-zalaegerszeg dorka-fodrasza-egerszeg orchidea-szepsegszalon-zalaegerszeg ls-hair-studio-zalaegerszeg hairstyles-by-mimi gabi-mesterfodrasz-hajorvos-nagykanizsa kreativ-hajstudio-nagykanizsa prestige-szepsegszalon-nagykanizsa bella-fodraszcikk-nagykanizsa torok-laura-hairdresser-nagykanizsa barber-boys-hair-salon-nagykanizsa pimpike-szepsegkucko-nagykanizsa eva-fodraszata-tapolca stilus-kozmetika-tapolca varga-andras-fodrasz-tapolca luxury-szalon-tapolca pipere-box-tapolca shiny-hair-nail-tapolca
          git diff --cached --quiet || (git commit -m 'Build Worker 5 website batch 81-100' && git push origin HEAD:${{ github.head_ref || github.ref_name }})
# PR trigger
