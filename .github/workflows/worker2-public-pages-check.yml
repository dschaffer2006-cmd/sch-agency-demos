name: Worker 2 public Pages check

on:
  push:
    branches: [main]
    paths:
      - '.nojekyll'
      - '.github/workflows/worker2-public-pages-check.yml'
      - 'worker2-public-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages rebuild
        run: sleep 45
      - name: Check all Worker 2 public URLs
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          slugs = [
            'aracsi-szepitok-balatonfured','euphoria-beauty-med-balatonfured','pure-white-beauty-balatonfured','agi-kozmetika-balatonfured','minnie-fodraszat-balatonfured',
            'balassa-szalon-siofok','fellai-barber-shop-siofok','loreal-professionnel-siofok','barbershop-by-balassa-siofok','edina-fodraszat-siofok',
            'selfie-fodraszat-siofok','szalonskicc-fodraszat-siofok','sd-beauty-project-keszthely','qubee-barbershop-keszthely','dreamhair-keszthely',
            'pure-studio-keszthely','szipi-barbershop-keszthely','gold-hajstudio-keszthely','borbely-cafe-keszthely','dorka-fodrasza-keszthely'
          ]
          base='https://dschaffer2006-cmd.github.io/sch-agency-demos/'
          out=[]
          for slug in slugs:
            url=base+slug+'/'
            code=None; title=''; err=''
            for attempt in range(8):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  code=r.getcode(); body=r.read(200000).decode('utf-8','ignore')
                  import re
                  m=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                  title=(m.group(1).strip() if m else '')
                if code==200: break
              except urllib.error.HTTPError as e:
                code=e.code; err=str(e)
              except Exception as e:
                err=str(e)
              time.sleep(15)
            out.append({'slug':slug,'url':url,'status':code,'title':title,'error':err,'ok':code==200})
            print(slug, code, title)
          report={'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'passed':sum(x['ok'] for x in out),'failed':sum(not x['ok'] for x in out),'items':out}
          open('worker2-public-pages-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit public URL report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker2-public-pages-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Worker 2 public GitHub Pages URL report'
            git pull --rebase origin main || true
            git push
          fi
