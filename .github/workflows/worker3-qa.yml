name: Worker 3 Chromium QA

on:
  push:
    paths:
      - '.github/workflows/worker3-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local HTTP server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/worker3-server.log 2>&1 &
          sleep 2
      - name: Run Worker 3 browser QA
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const slugs=['szepseg-sarok-keszthely','hairvision-veszprem','still-the-salon-veszprem','frix-hair-design-veszprem','ferfi-fodraszat-veszprem-veszprem','eszlinger-agnes-hair-veszprem','baranyai-szalon-veszprem','szlavik-hajstudio-veszprem','professzionalis-hajhosszabbitas-veszprem','barber-studio-veszprem-veszprem','dettus-fodraszat-veszprem-veszprem','hair-port-veszprem','bellissima-szepsegszalon-veszprem','kovacs-eszter-veszprem-fodraszat-veszprem','korody-barber-shop-balaton-plaza-veszprem','kozmetika-veszprem-veszprem','aloe-szalon-veszprem','zsolex-barbershop-veszprem','lux-barber-shop-veszprem-veszprem','eva-fodraszata-tapolca'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];
            for(const slug of slugs){
              const item={slug,critical:[],warnings:[],viewports:{}};
              for(const [mode,width,height] of [['desktop',1440,900],['mobile',390,844]]){
                const ctx=await browser.newContext({viewport:{width,height}});
                const page=await ctx.newPage(); const consoleErrors=[],pageErrors=[],failed=[];
                page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('requestfailed',r=>failed.push(r.url()));
                let status=null;
                try{const res=await page.goto(`http://127.0.0.1:8000/${slug}/`,{waitUntil:'networkidle',timeout:60000});status=res&&res.status();}catch(e){item.critical.push(`${mode}: navigation ${e.message}`)}
                await page.waitForTimeout(1200);
                const m=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,viewport:!!document.querySelector('meta[name="viewport"]'),text:document.body.innerText.toLowerCase(),imgs:[...document.images].map(i=>({ok:i.complete&&i.naturalWidth>0,src:i.src})),heads:[...document.querySelectorAll('h1,h2,h3')].map(h=>{const r=h.getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom}}),sections:[...document.querySelectorAll('header,section')].map(s=>{const r=s.getBoundingClientRect();return {w:r.width,h:r.height}}),ctas:[...document.querySelectorAll('.btn,.navcta')].map(a=>{const r=a.getBoundingClientRect();return {w:r.width,h:r.height}})}));
                if(!status||status>=400)item.critical.push(`${mode}: HTTP ${status}`); if(consoleErrors.length)item.critical.push(`${mode}: console errors ${consoleErrors.join(' | ')}`); if(pageErrors.length)item.critical.push(`${mode}: page errors ${pageErrors.join(' | ')}`); if(failed.length)item.critical.push(`${mode}: failed requests ${failed.join(' | ')}`); if(!m.viewport)item.critical.push(`${mode}: viewport meta missing`); if(m.sw>m.iw+1)item.critical.push(`${mode}: horizontal overflow ${m.sw}>${m.iw}`); if(m.imgs.some(x=>!x.ok))item.critical.push(`${mode}: broken image`); if(m.sections.some(x=>x.w<=0||x.h<=0))item.critical.push(`${mode}: zero-size section`); if(m.heads.some(x=>x.l<-1||x.r>m.iw+1))item.critical.push(`${mode}: heading overflow`); for(const bad of ['lorem ipsum','todo','placeholder'])if(m.text.includes(bad))item.critical.push(`${mode}: forbidden text ${bad}`); if(!m.ctas.length||m.ctas.some(x=>x.w<44||x.h<44))item.warnings.push(`${mode}: CTA touch target`);
                await page.screenshot({path:`${slug}/qa-${mode}.png`,fullPage:false});
                if(mode==='mobile'){const menu=page.locator('.menu');if(await menu.count()){await menu.click();await page.waitForTimeout(150);if(!(await page.locator('.navlinks').evaluate(e=>getComputedStyle(e).display!=='none')))item.critical.push('mobile: menu did not open');await page.screenshot({path:`${slug}/preview-mobile.png`,fullPage:false});try{await page.locator('.navlinks a[href="#szolgaltatasok"]').click();await page.waitForTimeout(200);if(!(await page.locator('.navlinks').evaluate(e=>getComputedStyle(e).display==='none')))item.critical.push('mobile: menu did not close after link');}catch(e){item.critical.push('mobile: menu interaction failed')}}}
                item.viewports[mode]={status,consoleErrors,pageErrors,failedRequests:failed,scrollWidth:m.sw,innerWidth:m.iw,brokenImages:m.imgs.filter(x=>!x.ok).map(x=>x.src)};await ctx.close();
              }
              item.technical_pass=item.critical.length===0;report.push(item);
            }
            await browser.close();fs.writeFileSync('worker3-qa.json',JSON.stringify({generated_at:new Date().toISOString(),worker:'Munkás 3',total:report.length,passed:report.filter(x=>x.technical_pass).length,failed:report.filter(x=>!x.technical_pass).length,items:report},null,2));
          })();
          NODE
      - name: Commit QA report and screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker3-qa.json '*/preview-mobile.png' '*/qa-desktop.png' '*/qa-mobile.png'
          if git diff --cached --quiet; then echo 'Worker 3 QA artifacts unchanged.'; else git commit -m 'Worker 3 Chromium QA and previews'; git push; fi
