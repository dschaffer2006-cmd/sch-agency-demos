name: Generate Worker 3 demos

on:
  push:
    paths:
      - '.github/worker3_payload.py'
      - '.github/workflows/generate-worker3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Worker 3 demo sites
        run: python3 .github/worker3_payload.py
      - name: Commit generated sites
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*/index.html'
          if git diff --cached --quiet; then
            echo 'Worker 3 demos unchanged.'
          else
            git commit -m 'Generate Worker 3 demo sites'
            git push
          fi
