name: Generate demo previews

on:
  push:
    paths:
      - '**/index.html'
      - '.github/workflows/generate-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local demo server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/demo-server.log 2>&1 &
          echo $! > /tmp/demo-server.pid
          sleep 2

      - name: Capture mobile previews
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium, devices } = require('playwright');

          (async () => {
            const folders = fs.readdirSync('.', { withFileTypes: true })
              .filter(entry => entry.isDirectory())
              .map(entry => entry.name)
              .filter(name => !name.startsWith('.') && name !== 'node_modules')
              .filter(name => fs.existsSync(path.join(name, 'index.html')));

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ ...devices['iPhone 13'] });

            for (const folder of folders) {
              const page = await context.newPage();
              try {
                await page.goto(`http://127.0.0.1:8000/${encodeURIComponent(folder)}/`, {
                  waitUntil: 'networkidle',
                  timeout: 60000
                });
              } catch (err) {
                console.log(`Network idle timeout for ${folder}; capturing current render.`);
              }
              await page.waitForTimeout(3500);
              await page.screenshot({
                path: path.join(folder, 'preview-mobile.png'),
                fullPage: false
              });
              await page.close();
              console.log(`Preview generated: ${folder}`);
            }

            await browser.close();
          })();
          NODE

      - name: Save previews to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*/preview-mobile.png'
          if git diff --cached --quiet; then
            echo 'Previews unchanged.'
          else
            git commit -m 'Generate mobile demo previews'
            git push
          fi
