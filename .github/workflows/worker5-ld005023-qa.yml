name: Worker 5 LD-005-023 QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/w5-ld005023-server.log 2>&1 &
          sleep 2
      - name: Run technical and booking QA
        run: node tools/worker5_ld005023_qa.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker5-ld005023-qa
          path: |
            worker5-ld005023-qa-report.json
            outreach/LD-005-023-orsi-zombori-kozmetika/preview-desktop.png
            outreach/LD-005-023-orsi-zombori-kozmetika/preview-mobile.png
            outreach/LD-005-023-orsi-zombori-kozmetika/desktop-full.png
            outreach/LD-005-023-orsi-zombori-kozmetika/mobile-full.png
          retention-days: 14
      - name: Commit screenshots after PASS
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outreach/LD-005-023-orsi-zombori-kozmetika/*.png
          git diff --cached --quiet || (git commit -m 'Add LD-005-023 QA screenshots' && git push origin HEAD:${{ github.head_ref || github.ref_name }})
