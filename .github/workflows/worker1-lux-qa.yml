name: Worker 1 Lux Barber QA

on:
  push:
    paths:
      - '.github/workflows/worker1-lux-qa.yml'
      - 'tools/worker1-lux-qa.mjs'
      - 'outreach/LD-001-023-lux-barber-shop/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/lux-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8769/outreach/LD-001-023-lux-barber-shop/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run desktop and mobile QA
        run: node tools/worker1-lux-qa.mjs
      - name: Commit validated screenshots and QA report safely
        run: |
          set -euo pipefail
          tar -czf /tmp/lux-artifacts.tgz outreach/LD-001-023-lux-barber-shop/preview-desktop.png outreach/LD-001-023-lux-barber-shop/preview-mobile.png qa/worker1/LD-001-023-lux-barber-shop worker1-lux-qa.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -B worker1-lux-publish origin/main
          tar -xzf /tmp/lux-artifacts.tgz
          git add outreach/LD-001-023-lux-barber-shop qa/worker1/LD-001-023-lux-barber-shop worker1-lux-qa.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'QA Lux Barber LD-001-023 demo [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
