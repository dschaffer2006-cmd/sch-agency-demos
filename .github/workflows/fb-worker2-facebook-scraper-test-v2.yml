name: FB Worker2 facebook-scraper public test v2

on:
  push:
    branches: [fb-research-worker2]
    paths:
      - 'research/fb-worker2/facebook-scraper-trigger-v2.txt'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb-research-worker2
      - name: Run diagnostic without failing job
        shell: bash
        run: |
          mkdir -p research/fb-worker2/facebook-scraper-test-v2
          set +e
          python3 -m pip install facebook-scraper > research/fb-worker2/facebook-scraper-test-v2/pip.txt 2>&1
          echo $? > research/fb-worker2/facebook-scraper-test-v2/pip-code.txt
          python3 - <<'PY' > research/fb-worker2/facebook-scraper-test-v2/run.txt 2>&1
          import json,traceback,pathlib,sys
          result=[]; err=''
          try:
              from facebook_scraper import get_posts
              for p in get_posts(group='883708115725466', pages=30, options={'comments': True, 'allow_extra_requests': True, 'posts_per_page': 10}):
                  result.append({'post_id':p.get('post_id'),'post_url':p.get('post_url'),'time':str(p.get('time')),'text':p.get('text'),'comments_count':p.get('comments'),'comments_full':p.get('comments_full',[])[:10]})
                  if len(result)>=120: break
          except Exception:
              err=traceback.format_exc()
          pathlib.Path('research/fb-worker2/facebook-scraper-test-v2/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          pathlib.Path('research/fb-worker2/facebook-scraper-test-v2/summary.json').write_text(json.dumps({'posts':len(result),'posts_with_comments_full':sum(bool(x.get('comments_full')) for x in result),'error':err},ensure_ascii=False,indent=2),encoding='utf-8')
          print('posts',len(result),'comment_posts',sum(bool(x.get('comments_full')) for x in result)); print(err)
          PY
          true
      - name: Commit diagnostic output
        if: always()
        run: |
          git config user.name 'Worker 2 Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/fb-worker2/facebook-scraper-test-v2
          git diff --cached --quiet && exit 0
          git commit -m 'FB Worker2 fault-tolerant scraper diagnostic output'
          git push origin HEAD:fb-research-worker2
